<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ALFA LED - Work Mobile</title>
  <style>
    :root {
      --bg: #04090d;
      --panel: #0a1218;
      --line: rgba(170, 199, 205, 0.25);
      --line-strong: rgba(214, 232, 235, 0.48);
      --text: #eef4f5;
      --muted: #97aab0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 20% -10%, #132029 0%, transparent 48%),
                  linear-gradient(180deg, #070d12, var(--bg));
      color: var(--text);
      font-family: "NB Architekt Std", "Segoe UI", Arial, sans-serif;
    }

    .shell {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 10px 10px calc(env(safe-area-inset-bottom) + 14px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 0 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(6, 11, 15, 0.78);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .home {
      color: var(--text);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
    }

    .head {
      margin: 6px 2px 12px;
    }

    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(26px, 7.2vw, 34px);
      letter-spacing: 0.01em;
      line-height: 1.05;
      font-weight: 600;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      padding: 10px 2px;
    }

    .list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      cursor: pointer;
      transform: translateY(14px);
      opacity: 0;
      transition: transform 420ms cubic-bezier(.2,.7,.2,1), opacity 420ms ease, border-color 220ms ease;
    }

    .panel.in {
      opacity: 1;
      transform: translateY(0);
    }

    .panel:active {
      border-color: var(--line-strong);
    }

    .panel-media {
      width: 100%;
      aspect-ratio: 16 / 8;
      object-fit: cover;
      display: block;
      background: #071018;
      transform: scale(1.02);
      transition: transform 420ms ease;
    }

    .panel:hover .panel-media,
    .panel:active .panel-media {
      transform: scale(1.05);
    }

    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.02) 1px,
        rgba(0, 0, 0, 0.02) 2px,
        rgba(0, 0, 0, 0.02) 3px
      );
      pointer-events: none;
      opacity: 0.45;
    }

    .panel-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 10px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(2,7,10,0.92) 85%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    }

    .panel-open {
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      border: 1px solid rgba(214, 232, 235, 0.44);
      border-radius: 999px;
      padding: 5px 8px;
      color: #e5f1f3;
      background: rgba(7, 14, 18, 0.54);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(3, 8, 11, 0.9);
      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: block;
    }

    .sheet {
      height: 100%;
      overflow: auto;
      padding: 12px 10px calc(env(safe-area-inset-bottom) + 14px);
      transform: translateY(14px);
      opacity: 0;
      transition: transform 220ms ease, opacity 220ms ease;
    }

    .modal.show .sheet {
      transform: translateY(0);
      opacity: 1;
    }

    .sheet-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 11, 15, 0.82);
      backdrop-filter: blur(8px);
    }

    .sheet-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      flex: 1;
    }

    .close {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 9px;
    }

    .sheet-media {
      width: 100%;
      max-height: 56vh;
      border: 1px solid var(--line);
      border-radius: 10px;
      object-fit: cover;
      background: #070f14;
      display: block;
    }

    .sheet-body {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: rgba(7, 14, 19, 0.72);
    }

    .sheet-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .sheet-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">ALFA LED</div>
      <a class="home" href="/">Anasayfa</a>
    </header>

    <section class="head">
      <p class="kicker">Work</p>
      <h1>Projeler</h1>
    </section>

    <div id="status" class="status">Projeler yukleniyor...</div>
    <section id="list" class="list" aria-live="polite"></section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Proje Detayi">
      <header class="sheet-head">
        <h2 id="m-title" class="sheet-title"></h2>
        <button id="m-close" class="close" type="button">Kapat</button>
      </header>
      <div id="m-media-wrap"></div>
      <div class="sheet-body">
        <p id="m-desc" class="sheet-desc"></p>
        <a id="m-link" class="sheet-link" href="#" target="_blank" rel="noopener" style="display:none">Projeyi Ac</a>
      </div>
    </section>
  </div>

  <script>
    (async function () {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("list");
      const modal = document.getElementById("modal");
      const mTitle = document.getElementById("m-title");
      const mDesc = document.getElementById("m-desc");
      const mMediaWrap = document.getElementById("m-media-wrap");
      const mClose = document.getElementById("m-close");
      const mLink = document.getElementById("m-link");

      const norm = (p) => "/" + String(p || "").replace(/^\/+/, "");

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("in");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      const closeModal = () => {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
        const v = mMediaWrap.querySelector("video");
        if (v) {
          try { v.pause(); } catch (_) {}
        }
        setTimeout(() => { mMediaWrap.innerHTML = ""; }, 220);
      };

      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      mClose.addEventListener("click", closeModal);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
      });

      const openModal = (item) => {
        mTitle.textContent = item.name || "Proje";
        mDesc.textContent = item.description || "";
        mMediaWrap.innerHTML = "";

        const poster = norm((item.video && item.video.thumbnail) || "assets/meta/social.jpg");
        const videoSrc = item.video && item.video.url ? norm(item.video.url) : "";

        if (videoSrc) {
          const v = document.createElement("video");
          v.className = "sheet-media";
          v.controls = true;
          v.playsInline = true;
          v.setAttribute("playsinline", "true");
          v.setAttribute("webkit-playsinline", "true");
          v.preload = "metadata";
          v.poster = poster;
          v.src = videoSrc;
          v.addEventListener("error", () => {
            const img = document.createElement("img");
            img.className = "sheet-media";
            img.alt = item.name || "Proje";
            img.src = poster;
            mMediaWrap.innerHTML = "";
            mMediaWrap.appendChild(img);
          });
          mMediaWrap.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.className = "sheet-media";
          img.alt = item.name || "Proje";
          img.src = poster;
          mMediaWrap.appendChild(img);
        }

        if (item.projectURL) {
          mLink.style.display = "inline-block";
          mLink.href = item.projectURL;
        } else {
          mLink.style.display = "none";
        }

        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
      };

      try {
        const res = await fetch("/assets/cms/projects-dev.json", { cache: "no-store" });
        const data = await res.json();
        const items = (Array.isArray(data) ? data : [])
          .filter((x) => x && x.video && (x.video.thumbnail || x.video.url))
          .slice(0, 24);

        if (!items.length) {
          statusEl.textContent = "Proje bulunamadi.";
          return;
        }

        statusEl.textContent = "";

        items.forEach((item, idx) => {
          const panel = document.createElement("article");
          panel.className = "panel";
          panel.style.transitionDelay = Math.min(idx * 28, 260) + "ms";

          const media = document.createElement("img");
          media.className = "panel-media";
          media.loading = "lazy";
          media.alt = item.name || "Proje";
          media.src = norm((item.video && item.video.thumbnail) || "assets/meta/social.jpg");
          media.addEventListener("error", () => {
            media.src = "/assets/meta/social.jpg";
          });

          const scan = document.createElement("div");
          scan.className = "scanline";

          const overlay = document.createElement("div");
          overlay.className = "panel-overlay";

          const title = document.createElement("h3");
          title.className = "panel-title";
          title.textContent = item.name || "Proje";

          const open = document.createElement("span");
          open.className = "panel-open";
          open.textContent = "Detay";

          overlay.appendChild(title);
          overlay.appendChild(open);

          panel.appendChild(media);
          panel.appendChild(scan);
          panel.appendChild(overlay);

          panel.addEventListener("click", () => openModal(item));

          listEl.appendChild(panel);
          revealObserver.observe(panel);
        });
      } catch (_) {
        statusEl.textContent = "Projeler yuklenemedi.";
      }
    })();
  </script>
</body>
</html>
