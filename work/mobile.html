<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ALFA LED - Projeler</title>
  <style>
    :root {
      --bg: #060d13;
      --bg2: #0b1720;
      --panel: #0f212b;
      --line: rgba(124, 229, 214, 0.24);
      --line-strong: rgba(124, 229, 214, 0.44);
      --text: #e9f7f5;
      --muted: #9ab3b5;
      --accent: #79e9d5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 14% 8%, #12313b 0%, transparent 40%),
                  linear-gradient(160deg, var(--bg2), var(--bg));
      color: var(--text);
      font-family: "NB Architekt Std", "Segoe UI", Arial, sans-serif;
    }

    .shell {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 12px 12px calc(env(safe-area-inset-bottom) + 16px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(5, 13, 19, 0.82);
      backdrop-filter: blur(8px);
      margin: 4px 0 12px;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #d7f8f2;
    }

    .home {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      padding: 6px 10px;
      background: rgba(121, 233, 213, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 8vw, 34px);
      line-height: 1.08;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      max-width: 38ch;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      padding: 10px 2px;
    }

    .list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(14, 33, 43, 0.96), rgba(7, 18, 24, 0.96));
      overflow: hidden;
      cursor: pointer;
      transform: translateY(16px);
      opacity: 0;
      transition: transform 420ms ease, opacity 420ms ease, border-color 220ms ease;
    }

    .panel.in {
      opacity: 1;
      transform: translateY(0);
    }

    .panel:active {
      border-color: var(--line-strong);
    }

    .panel-media {
      width: 100%;
      aspect-ratio: 16 / 7;
      object-fit: cover;
      display: block;
      background: #08131a;
      filter: contrast(1.08) saturate(1.08) brightness(1.03);
    }

    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      top: -40%;
      height: 35%;
      background: linear-gradient(180deg, rgba(121,233,213,0.02), rgba(121,233,213,0.18), rgba(121,233,213,0.02));
      animation: scan 3.8s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      to { transform: translateY(320%); }
    }

    .panel-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 11px;
      border-top: 1px solid rgba(124, 229, 214, 0.15);
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
    }

    .panel-open {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ccfaf2;
      border: 1px solid rgba(124, 229, 214, 0.35);
      border-radius: 999px;
      padding: 5px 8px;
      white-space: nowrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 12, 0.88);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: flex-end;
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-height: 92vh;
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #0c1d27, #071219);
      overflow: auto;
      padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
      transform: translateY(100%);
      transition: transform 260ms ease;
    }

    .modal.show .sheet {
      transform: translateY(0);
    }

    .sheet-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid rgba(124, 229, 214, 0.18);
      background: rgba(8, 19, 26, 0.9);
      backdrop-filter: blur(8px);
    }

    .sheet-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      flex: 1;
    }

    .close {
      border: 1px solid var(--line);
      background: rgba(121, 233, 213, 0.08);
      color: var(--text);
      border-radius: 999px;
      font-size: 11px;
      padding: 6px 10px;
    }

    .sheet-media-wrap {
      padding: 10px 12px 0;
    }

    .sheet-media {
      width: 100%;
      max-height: 54vh;
      border-radius: 12px;
      border: 1px solid rgba(124, 229, 214, 0.2);
      background: #060f16;
      object-fit: cover;
    }

    .sheet-body {
      padding: 12px;
    }

    .sheet-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .sheet-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(121, 233, 213, 0.08);
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">ALFA LED</div>
      <a class="home" href="/">Anasayfa</a>
    </header>

    <h1>Projeler</h1>
    <p class="sub">LED paneller alt alta listelenir. Kartlara dokununca proje detayi acilir.</p>

    <div id="status" class="status">Projeler yukleniyor...</div>
    <section id="list" class="list" aria-live="polite"></section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Proje Detayi">
      <header class="sheet-head">
        <h2 id="m-title" class="sheet-title"></h2>
        <button id="m-close" class="close" type="button">Kapat</button>
      </header>
      <div class="sheet-media-wrap" id="m-media-wrap"></div>
      <div class="sheet-body">
        <p id="m-desc" class="sheet-desc"></p>
        <a id="m-link" class="sheet-link" href="#" target="_blank" rel="noopener" style="display:none">Projeyi Ac</a>
      </div>
    </section>
  </div>

  <script>
    (async function () {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("list");

      const modal = document.getElementById("modal");
      const mTitle = document.getElementById("m-title");
      const mDesc = document.getElementById("m-desc");
      const mMediaWrap = document.getElementById("m-media-wrap");
      const mClose = document.getElementById("m-close");
      const mLink = document.getElementById("m-link");

      const norm = (p) => "/" + String(p || "").replace(/^\/+/, "");

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("in");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      const closeModal = () => {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
        const v = mMediaWrap.querySelector("video");
        if (v) {
          try { v.pause(); } catch (_) {}
        }
        setTimeout(() => { mMediaWrap.innerHTML = ""; }, 260);
      };

      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      mClose.addEventListener("click", closeModal);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
      });

      const openModal = (item) => {
        mTitle.textContent = item.name || "Proje";
        mDesc.textContent = item.description || "";
        mMediaWrap.innerHTML = "";

        const poster = norm((item.video && item.video.thumbnail) || "assets/meta/social.jpg");
        const videoSrc = item.video && item.video.url ? norm(item.video.url) : "";

        if (videoSrc) {
          const v = document.createElement("video");
          v.className = "sheet-media";
          v.controls = true;
          v.playsInline = true;
          v.setAttribute("playsinline", "true");
          v.setAttribute("webkit-playsinline", "true");
          v.preload = "metadata";
          v.poster = poster;
          v.src = videoSrc;
          v.addEventListener("error", () => {
            const img = document.createElement("img");
            img.className = "sheet-media";
            img.alt = item.name || "Proje";
            img.src = poster;
            mMediaWrap.innerHTML = "";
            mMediaWrap.appendChild(img);
          });
          mMediaWrap.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.className = "sheet-media";
          img.alt = item.name || "Proje";
          img.src = poster;
          mMediaWrap.appendChild(img);
        }

        if (item.projectURL) {
          mLink.style.display = "inline-block";
          mLink.href = item.projectURL;
        } else {
          mLink.style.display = "none";
        }

        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
      };

      try {
        const res = await fetch("/assets/cms/projects-dev.json", { cache: "no-store" });
        const data = await res.json();
        const items = (Array.isArray(data) ? data : [])
          .filter((x) => x && x.video && (x.video.thumbnail || x.video.url))
          .slice(0, 22);

        if (!items.length) {
          statusEl.textContent = "Proje bulunamadi.";
          return;
        }

        statusEl.textContent = "";

        items.forEach((item, idx) => {
          const panel = document.createElement("article");
          panel.className = "panel";
          panel.style.transitionDelay = Math.min(idx * 35, 300) + "ms";

          const media = document.createElement("img");
          media.className = "panel-media";
          media.loading = "lazy";
          media.alt = item.name || "Proje";
          media.src = norm((item.video && item.video.thumbnail) || "assets/meta/social.jpg");
          media.addEventListener("error", () => {
            media.src = "/assets/meta/social.jpg";
          });

          const scan = document.createElement("div");
          scan.className = "scanline";

          const body = document.createElement("div");
          body.className = "panel-body";

          const title = document.createElement("h3");
          title.className = "panel-title";
          title.textContent = item.name || "Proje";

          const open = document.createElement("span");
          open.className = "panel-open";
          open.textContent = "Ac";

          body.appendChild(title);
          body.appendChild(open);

          panel.appendChild(media);
          panel.appendChild(scan);
          panel.appendChild(body);

          panel.addEventListener("click", () => openModal(item));

          listEl.appendChild(panel);
          revealObserver.observe(panel);
        });
      } catch (_) {
        statusEl.textContent = "Projeler yuklenemedi.";
      }
    })();
  </script>
</body>
</html>
