<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ALFA LED - Projeler (Mobil)</title>
  <style>
    :root {
      --bg: #06141a;
      --panel: #0d2028;
      --line: rgba(127, 240, 220, 0.18);
      --text: #e9fbf7;
      --muted: #9cb5b0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "NB Architekt Std", "Segoe UI", Arial, sans-serif; }
    .wrap { width: min(980px, 100%); margin: 0 auto; padding: 18px 14px calc(env(safe-area-inset-bottom) + 18px); }
    .head { position: sticky; top: 0; z-index: 10; background: linear-gradient(180deg, rgba(6,20,26,0.96), rgba(6,20,26,0.84)); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .head-in { width: min(980px, 100%); margin: 0 auto; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
    .home { color: var(--text); text-decoration: none; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
    h1 { margin: 10px 0 6px; font-size: 22px; line-height: 1.2; }
    .sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .card { background: linear-gradient(180deg, rgba(13,32,40,0.95), rgba(8,22,28,0.95)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .media { width: 100%; display: block; background: #03090c; aspect-ratio: 16 / 9; object-fit: cover; }
    .meta { padding: 10px 11px 12px; }
    .title { margin: 0 0 5px; font-size: 15px; line-height: 1.3; }
    .desc { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .status { color: var(--muted); font-size: 12px; padding: 14px 2px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header class="head">
    <div class="head-in">
      <div class="brand">ALFA LED</div>
      <a class="home" href="/">Anasayfa</a>
    </div>
  </header>
  <main class="wrap">
    <h1>Projeler</h1>
    <p class="sub">Mobil uyumlu gorunum. Videolar dokununca oynar, kartlar birbirine girmez.</p>
    <div id="status" class="status">Projeler yukleniyor...</div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script>
    (async function () {
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");
      const norm = (p) => "/" + String(p || "").replace(/^\/+/, "");
      const isValidVideo = async (url) => {
        try {
          const r = await fetch(url, { method: "HEAD", cache: "no-store" });
          const ct = String(r.headers.get("content-type") || "").toLowerCase();
          return r.ok && ct.indexOf("video/mp4") !== -1;
        } catch (_) {
          return false;
        }
      };
      try {
        const res = await fetch("/assets/cms/projects-dev.json", { cache: "no-store" });
        const list = await res.json();
        const items = Array.isArray(list) ? list : [];
        const filtered = items.filter(i => i && i.video && i.video.url).slice(0, 30);
        if (!filtered.length) {
          status.textContent = "Proje bulunamadi.";
          return;
        }
        status.textContent = "";
        const checked = await Promise.all(filtered.map(async (item) => {
          const videoUrl = norm(item.video.url);
          const thumbUrl = item.video.thumbnail ? norm(item.video.thumbnail) : "";
          const ok = await isValidVideo(videoUrl);
          return { item, videoUrl, thumbUrl, ok };
        }));

        checked.forEach(({ item, videoUrl, thumbUrl, ok }) => {
          const card = document.createElement("article");
          card.className = "card";
          const media = ok ? document.createElement("video") : document.createElement("img");
          media.className = "media";
          if (ok) {
            media.controls = true;
            media.muted = true;
            media.playsInline = true;
            media.setAttribute("playsinline", "true");
            media.setAttribute("webkit-playsinline", "true");
            media.preload = "metadata";
            media.poster = thumbUrl;
            media.src = videoUrl;
          } else {
            media.loading = "lazy";
            media.alt = item.name || "Proje gorseli";
            media.src = thumbUrl;
          }
          const meta = document.createElement("div");
          meta.className = "meta";
          const t = document.createElement("h2");
          t.className = "title";
          t.textContent = item.name || "Proje";
          const d = document.createElement("p");
          d.className = "desc";
          d.textContent = ok ? (item.description || "") : ((item.description || "") + " (Video yakinda)");
          meta.appendChild(t);
          meta.appendChild(d);
          card.appendChild(media);
          card.appendChild(meta);
          grid.appendChild(card);
        });
      } catch (e) {
        status.textContent = "Projeler yuklenemedi.";
      }
    })();
  </script>
</body>
</html>
